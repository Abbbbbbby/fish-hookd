field2:{"type":"field","size":[283,248],"pos":[189,44],"locked":1,"script":"credits.1","scrollbar":0,"value":{"text":["","I actually ended up going onto the Decker community on itch.io and asking a question. Mr. Internet Janitor ","responded"," to me pretty fast! \n\nIt was a question about the dd.chat[] function, and whether I could use dd.ask[] within it. Spoiler alert: no, the function wasn't created for that. But! He did show me how to manually code it using Lil.\n\nI have yet to try it as of writing this. You will know if I've succeeded or not if you're able to select all three dialogue options that each contain an additional dialogue option within them.\n\nRegardless, big thank you to him!"],"font":["","ahmCasual","ahmCasual","ahmCasual"],"arg":["","","https://itch.io/t/6967957/about-ddask-within-ddchat",""]}}

field2:{"type":"field","size":[454,204],"pos":[29,64],"locked":1,"animated":1,"show":"transparent","border":0,"value":"For this project, of the three 'paths' we were given to choose from I decided on story. I chose story primarily because I wanted to include original characters* in my work, as they are something that are quite meaningful to me in terms of my identity as an artist and just as a person\n\n(*I only had time to include one character, unfortunately.)\n\nThe character I chose has no true name at the moment. I want to do more with them. But they, as with majority of my characters, reflect some aspect or desire of myself. For this project in particular I bent the rules a little and went out of character; they reflect more closely to me in order to get a bit more personal.\n\nMaking a game is something I've wanted to pursue for a while, so this project has been a good opportunity to explore that more. I hope that this project reflects both my creativity as an artist as well as the possible technical skills I have and what more I can do in the future with programming."}

script1:{"type":"field","size":[189,83],"pos":[15,59],"scrollbar":1,"scroll":281,"value":"!sleep\n!wait 30\n!talk fish neutral\n\nOh, hello.\n\nWhat brings you here?\n\n!show fish smile\n\nAhh, did you want to chat?\n\nThat makes me happy, hehe.\n\n!wait 60\n!show fish frown\n!wait 60\n\nUhh... what did you want to chat about...?\n\n!sleep\n!wait 30\n!show fish ehe\n\nAh... ehehe...\n\nNo, I get it, I suck at conversation starters too! Especially since I'm always stuck in this room. Haha.\n\n!show fish neutral\n\nSo... \n\nWhat's up?"}

opt1:{"type":"field","size":[92,63],"pos":[16,169],"scrollbar":1,"scroll":301,"value":"!show fish smile\n\nMy hobbies...? Uh, well, I like drawing, and reading manga. I dunno...\n\n!show fish frown\n\nWhen I think about it, I don't have many hobbies, huh?\n\nSometimes I wonder if it'd be better to branch out...\n\n!show fish mad\n\nI mean, obviously it would! But I can never find the motivation.\n\n!show fish frown\n\n... Ah, sorry. I'm sure you don't care. Oh, but, just for the sake of asking..."}
opt2:{"type":"field","size":[93,63],"pos":[15,251],"scrollbar":1,"value":"!show fish smile\n\nWhat do I like? Ohh, that's a good question! I like a lot of things.\n\nArt, games, art in games... Leave it to me to get emotionally attached to characters, hah!\n\n!show fish neutral\n\nI like arcades too, mainly for rhythm games, or claw machine prizes. I like collecting cute plushies and trinkets!\n\n!show fish smile\n\nOh! Oh!\n\nThere's this one series, it's pretty popular. It follows this little creature, like something small and cute.\n\nThey have friends, struggles, worries, ups and downs, all sorts of things that us people go through.\n\nThat's why I find it so charming, as well as comforting.\n\n!show fish ehe\n\nOh... I like BL as well.\n\nWhat's BL... ehe, are you sure you want to know?"}
opt3:{"type":"field","size":[93,63],"pos":[232,251],"scrollbar":1,"scroll":90,"value":"!show fish neutral\n\nHow am I...? Well, uhm...\n\n!show fish frown\n\nTo be honest, I'm not sure.\n\nSometimes I feel fine. But... other days it just feels hard even getting out of bed.\n\n!show fish neutral\n\nBut who am I to think any of that matters? I mean, I'm sure everyone goes through stuff like that. Even you, right?\n\n!show fish frown\n\n... Still, I think part of me would like it if there were someone there to care. Even if it's the most trivial, small thing ever that's bothering me.\n\nKnowing that someone is there who cares about me is a nice feeling.\n\nBut whenever I find that person, I always mess it up. I sometimes forget that they're as much of a person as I am. I end up a burden to them or I say stuff I regret afterwards, and I hate it.\n\nWhat's done is done, though. I can't take back what I say or how I act towards them. All I can do is try to learn and change. If I even can.\n\n!show fish neutral\n\nJust makes me wish I could act \"normally\" from the beginning, hehe... whatever that is.\n\n!show fish AHH\n\n... Oh, sorry! I kind of, got a little personal. I just met you, haha, what am I doing?\n\n!show fish neutral"}
opt1_1:{"type":"field","size":[92,27],"pos":[121,169],"scrollbar":1,"scroll":237,"value":"!show fish neutral\n\nehe... I guess you're right! It takes time for everyone.\n\nMaybe with time I'll discover new things that become my hobbies! Or I can just expand on old ones.\n\nI guess the only way to though is if I put the effort...\n\n!show fish frown\n\nWhich sounds daunting.\n\n!show fish neutral\n\nBut it's doable, for sure!"}
opt1_2:{"type":"field","size":[92,27],"pos":[121,206],"scrollbar":1,"scroll":167,"value":{"text":["!show fish mad\n","\n(Why even ask me in the first place, then??)\n\n!show fish AHH\n\nOh, uhm, sorry! I was just thinking.\n\n!show fish frown\n\n... But I get it, I'm sure this isn't interesting, haha.\n\nIt's alright if you don't want to know."],"font":["","body"],"arg":["",""]}}
opt2_1:{"type":"field","size":[92,27],"pos":[120,251],"scrollbar":1,"value":"!show fish smile\n\nHehehe... I'm sort of glad you asked. Even if it's just the boys' love genre.\n\n!show fish ehe\n\n... Y'know...\n\nMen...\n\n!shake 10 10 15\n\nkissing...\n\n!shake 30 30 15\n\nmen...!\n\n!shake 30 30 15\n\nI won't get into specifics for your sake, but let's just say I'm a rather big fan of stories in the genre. All sorts!\n\n!show fish neutral\n\nAhh, that was less embarrassing than I imagined it'd be. Y'know...\n\nIt's kind of nice to have someone hear you out on your interests. Especially when I'm so afraid of them being weird or unconventional.\n\nThank you... for listening, hehe."}
opt2_2:{"type":"field","size":[92,27],"pos":[120,288],"scrollbar":1,"value":"!show fish frown\n\nOh, well, yeah. Haha, don't worry.\n\n!show fish AHH\n\nI won't bore you or weird you out or anything! It's fine.\n\n!show fish neutral\n\nThe last thing I'd wanna do is be a bother... I don't really think my interests are worth the attention, anyways.\n\nBetter to think of them on my own time, y'know?"}
opt3_1:{"type":"field","size":[92,27],"pos":[337,251],"scrollbar":1,"scroll":4,"value":"!show fish neutral\n\nHaha, really, sorry if that got too personal. Sometimes I feel like I go off too much, especially on people who don't need to hear it.\n\n!show fish frown\n\nI mean, even if it's nice to have someone... you heard what I said, right? Right. Want to avoid that.\n\n...\n\n!show fish mad\n\n......\n\n!show fish AHH\n\n... Oh! Sorry! I was spacing out. But... enough of me! Hehe."}
opt3_2:{"type":"field","size":[92,27],"pos":[337,288],"scrollbar":1,"scroll":421,"value":"!show fish frown\n\n...... I...\n\n... You're probably right. Even if I feel like a burden... I'm probably exaggerating it in my head.\n\nI mean, you're still here, and listening. Maybe that means something! Unless, like, you're being forced to listen... But I shouldn't overthink that, huh?\n\n!show fish neutral\n\nI'm kind of glad you told me that.\n\n!show fish frown\n\nIt's hard... to care about myself sometimes. Even though I really should.\n\n!show fish mad\n\nIt feels selfish, but it really isn't, is it? Everyone is a little bit selfish, anyways. Otherwise we'd just completely neglect ourselves!\n\n!show fish neutral\n\nI don't live for other people, as much as my brain tries to convince me. I live for myself.\n\n... Thanks. I feel a little better now, hehe."}
script2:{"type":"field","size":[176,36],"pos":[226,195],"scrollbar":1,"scroll":48,"value":"!sleep\n!wait 30\n!show fish neutral\n\nY'know, it's nice to actually talk with someone Even if we only just met.\n\nIt was, well..."}
end1:{"type":"field","size":[114,83],"pos":[231,30],"scrollbar":1,"value":"!show fish smile\n\n... Really? You'll let me show you?! I... I dunno, for some reason I thought you might say no, hehe...\n\nBut okay! It's over here!"}
end2:{"type":"field","size":[114,83],"pos":[359,30],"scrollbar":1,"value":"!show fish frown\n\nOh, uhm, well... that's okay!!! Don't worry. No pressure at all. I don't want to bother you anyway.\n\n!show fish neutral\n\nUhm, well, it was nice talking to you. I don't really know what else there is to do... I guess you could leave."}
yay:{"type":"field","size":[70,33],"pos":[420,148],"scrollbar":1,"scroll":101,"value":"!show fish smile\n\nReally nice to talk to you, y'know?\n\n!show fish ehe\n\nIf we could talk more, I wouldn't mind, hehe."}
nay:{"type":"field","size":[70,33],"pos":[420,198],"scrollbar":1,"scroll":1,"value":"!show fish frown\n\nTo be completely honest... it could've been better, maybe.\n\nBut you weren't bad to talk to, I guess!"}
script3:{"type":"field","size":[176,36],"pos":[226,148],"scrollbar":1,"scroll":20,"value":"!show fish neutral\n\nAnd, well... I'm in some way glad that we met. Being with you... I get this warm fuzzy feeling in my chest.\n\n!show fish ehe\n\nIs this like... a dream?\n\n!show fish AHH\n\nOr am I dying...? Am I dying while dreaming? Dying in a dream?\n\nNo, no... that's not it...\n\nWait...\n\n!show fish ehe\n\nCould this be...\n\nLove...?\n\n!shake 10 10 15\n!show fish AHH\n\nNONO!! Of course not!!! Haha what am I thinking I'm hilarious aren't I You aren't even My Type Haha\n\n!show fish neutral\n\nNo... I think it's just simply being happy. That I have company.\n\n!show fish frown\n\n... I really need to get out of my room more often.\n\n!show fish neutral\n\nBut anyways, there is... something that I want to show you. If you don't mind... ehe.\n\nWhat do you say?"}

field2:{"type":"field","size":[125,49],"pos":[372,247],"scrollbar":1,"style":"code","scroll":40,"value":"o:()\no.size:400,0\no.speed:4\no.tsound:(\"aaa\")\n \npt.setup[deck game\n \"!show fish neutral position1\",\n \"!talk fish neutral\"]\n \ngo[\"test\" \"BoxIn\"]\ndd.open[deck o]\n\non hobby_discussion do\n dd.say[dialogue.widgets.opt1.value]\n if 0~dd.ask[\"What do you think?\" (\"It takes time to explore\",\"You've missed out on a lot already.\")]\n  dd.say[dialogue.widgets.opt1_1.value]\n else\n  dd.say[dialogue.widgets.opt1_2.value]\n end\nend\n\non hobby_discussion do\n dd.say[dialogue.widgets.opt1.value]\n if 0~dd.ask[\"What do you think?\" (\"It takes time to explore\",\"You've missed out on a lot already.\")]\n  dd.say[dialogue.widgets.opt1_1.value]\n else\n  dd.say[dialogue.widgets.opt1_2.value]\n end\nend\n\non interest_discussion do\n dd.say[dialogue.widgets.opt2.value]\n if 0~dd.ask[\"Do you wanna know?\" (\"Sure, tell me!\",\"Actually, I don't really care.\")]\n  dd.say[dialogue.widgets.opt2_1.value]\n else\n  dd.say[dialogue.widgets.opt2_2.value]\n end\nend\n\non self_discussion do\n dd.say[dialogue.widgets.opt3.value]\n if 0~dd.ask[\"Ahh, sorry about that!\"\n  (\"It's okay.\",\"Don't undermine yourself.\")]\n  dd.say[dialogue.widgets.opt3_1.value]\n else\n  dd.say[dialogue.widgets.opt3_2.value]\n end\nend\n\ndd.open[deck]\nr:metachat[\n \"What would you like to chat about?\"\n raze insert q a with\n  \"What are your hobbies?\" hobby_discussion\n  \"What do you like?\"      interest_discussion\n  \"How are you?\"           self_discussion\n end\n]\ndd.say[\"goodbye, then.\"]\ndd.close[]"}

field1:{"type":"field","size":[337,243],"pos":[15,56],"scrollbar":1,"style":"code","scroll":784,"value":"n:0\ny:0\n\no:()\no.size:350,0\no.speed:4\no.tsound:(\"aaa\")\n \npt.setup[deck game\n \"!show fish neutral position1\",\n \"!talk fish neutral\"\n ]\n \ngo[\"game\" \"BoxIn\"]\ndd.open[deck o]\n dd.say[dialogue.widgets.script1.value]\n \non hobby_discussion do\n dd.say[dialogue.widgets.opt1.value]\n if 0~dd.ask[\"What do you think?\" (\"It takes time to explore\",\"You've missed out on a lot already.\")]\n  dd.say[dialogue.widgets.opt1_1.value]\n else\n  dd.say[dialogue.widgets.opt1_2.value]\n end\nend\n\non hobby_discussion do\n dd.say[dialogue.widgets.opt1.value]\n if 0~dd.ask[\"What do you think?\" (\"It takes time to explore\",\"You've missed out on a lot already.\")]\n  dd.say[dialogue.widgets.opt1_1.value]\n  y:y+1\n else\n  dd.say[dialogue.widgets.opt1_2.value]\n  n:n+1\n end\nend\n\non interest_discussion do\n dd.say[dialogue.widgets.opt2.value]\n if 0~dd.ask[\"Do you wanna know?\" (\"Sure, tell me!\",\"Actually, I don't really care.\")]\n  dd.say[dialogue.widgets.opt2_1.value]\n  y:y+1\n else\n  dd.say[dialogue.widgets.opt2_2.value]\n  n:n+1\n end\nend\n\non self_discussion do\n dd.say[dialogue.widgets.opt3.value]\n if 0~dd.ask[\"Ahh, sorry about that!\"\n  (\"It's okay.\",\"Don't undermine yourself.\")]\n  dd.say[dialogue.widgets.opt3_1.value]\n  n:n+1\n else\n  dd.say[dialogue.widgets.opt3_2.value]\n  y:y+1\n end\nend\n\nr:metachat[\n \"What would you like to chat about?\"\n raze insert q a with\n  \"What are your hobbies?\" hobby_discussion\n  \"What do you like?\"      interest_discussion\n  \"How are you?\"           self_discussion\n end\n]\ndd.say[dialogue.widgets.script2.value]\nif y>n\n dd.say[dialogue.widgets.yay.value]\nelse\n dd.say[dialogue.widgets.nay.value]\nend\ndd.say[dialogue.widgets.script3.value]\nif 0~dd.ask[\"Would you like to see?\" \n (\"Sure!\",\"Nah.\")]\n dd.say[dialogue.widgets.end1.value]\n go[\"end1\" \"BoxIn\"]\n dd.close[]\n pt.clear[\"game\"]\nelse\n dd.say[dialogue.widgets.end2.value]\n go[\"end2\" \"BoxIn\"]\n dd.close[]\n pt.clear[\"game\"]\nend\n \ndd.close[]\npt.clear[\"game\"]"}

{module:dd}
description:"Display sequential, styled modal dialogs for visual novels."
version:1.8
{script}
# state/constants:
local host:0
local canvas:0
local padding:10
local margin:20
local arrow:image["%%IMG0AAsABv/gf8A/gB8ADgAEAA=="]
local arrow_anim:arrow,image[arrow.size]

# config:
local tfont:"body"
local bfont:"body"
local align:"left"
local balign:"center"
local fcolor:32
local bcolor:1
local next:arrow_anim
local nextd:10
local speed:0
local names:() dict ()
local border:0
local bborder:0
local pad:()
local bpad:()
local osound:"" # open box
local nsound:"" # advance to next box
local asound:"" # make a choice
local tsound:"" # talk
local dsize:()
local dpos:0

on ifmt x do x format names end
on fmt x do update text:ifmt @ text from rtext.cat[x] end
on tween a b t do a+(b-a)*0|1&t end
on rin x pos size do min(x>pos),(x<pos+size) end

local gamepad_mode:0
on tick do
 if !gamepad_mode
  if max range gamepad.down|gamepad.held|gamepad.up
   gamepad_mode:1
  end
 end
 host.card.event["animate"] sleep[]
end

on sfx x do
 play[if "list"~typeof x random[x] else x end]
end

on draw_border do
 canvas.clear[]
 if border.type~"image"
  canvas.segment[border 0,0,canvas.size (range pad)]
 else
  canvas.pattern:bcolor
  canvas.rect[0,0 canvas.size]
  canvas.pattern:fcolor
  canvas.box[0,0 canvas.size]
 end
end

on repos pos size do
 if dpos~"center"
  .5*host.card.size-size
 elseif dpos in host.card.widgets
  t:host.card.widgets[dpos]
  t.pos+.5*t.size-size
 else pos
 end
end

on resize height do
 cs0:canvas.size
 cs1:((host.card.size[0]-2*margin) unless dsize[0]),height
 cp0:canvas.pos
 cp1:repos[(.5*host.card.size[0]-cs1[0]),host.card.size[1]-cs1[1]+margin cs1]
 each t in .2*range 6
  canvas.size:tween[cs0 cs1 t]
  canvas.pos :tween[cp0 cp1 t]
  draw_border[]
  tick[]
 end
end

module.open:on open deck etc do
 if canvas & canvas.show~"transparent" close[] end
 host:deck
 canvas:host.card.widgets.dd_overlay
 if !canvas canvas:host.card.add["canvas" "dd_overlay"] end
 style[etc]
 canvas.size:((host.card.size[0]-2*margin) unless dsize[0]),0
 canvas.pos:repos[(.5*host.card.size[0]-canvas.size[0]),host.card.size[1]-margin canvas.size]
 canvas.show:"transparent"
 canvas.border:0
 sfx[osound]
end

module.style:on style etc do
 fcolor:if "fcolor" in etc etc.fcolor else 32         end
 bcolor:if "bcolor" in etc etc.bcolor else 1          end
 tfont :if "tfont"  in etc etc.tfont  else "body"     end
 bfont :if "bfont"  in etc etc.bfont  else "body"     end
 align :if "align"  in etc etc.align  else "left"     end
 balign:if "balign" in etc etc.balign else "center"   end
 names :if "names"  in etc etc.names  else ()dict()   end
 next  :if "next"   in etc etc.next   else arrow_anim end
 nextd :if "nextd"  in etc etc.nextd  else 10         end
 speed :if "speed"  in etc etc.speed  else 0          end
 osound:if "osound" in etc etc.osound else ""         end
 nsound:if "nsound" in etc etc.nsound else ""         end
 asound:if "asound" in etc etc.asound else ""         end
 tsound:if "tsound" in etc etc.tsound else ""         end
 dsize: if "size"   in etc etc.size   else ()         end
 dpos:  if "pos"    in etc etc.pos    else 0          end
 if !dsize[0] dsize[0]:nil end
 if !dsize[1] dsize[1]:nil end
 border:etc.border.image.copy[]
 pad:"ltrb" dict 4 take padding unless etc.border.margin
 bborder:etc.bborder.image.copy[]
 bpad:"ltrb" dict 4 take (2,10,2,10) unless etc.bborder.margin
 if balign~"left"  balign:"center_left"  end
 if balign~"right" balign:"center_right" end
 if "image"~typeof next next:next,image[next.size] end
 if (()~next)|(!"list"~typeof next) next:arrow_anim end
 if 1~count next next:next,image[next.size] end
 nextd:1|nextd
end

module.getstyle:on getstyle do
 raze insert k v with
  "fcolor"  fcolor
  "bcolor"  bcolor
  "tfont"   tfont
  "bfont"   bfont
  "align"   align
  "balign"  (("center_left","center_right","center") dict ("left","right","center"))[balign]
  "names"   names
  "next"    next
  "nextd"   nextd
  "speed"   speed
  "osound"  osound
  "nsound"  nsound
  "asound"  asound
  "tsound"  tsound
  "size"    dsize
  "pos"     dpos
  "border"  (("image","margin")dict((list  border),(list range  pad)))
  "bborder" (("image","margin")dict((list bborder),(list range bpad)))
 end
end

module.show:on show x do
 canvas.toggle["transparent" x]
end

module.close:on close do
 if canvas & canvas.show~"transparent" resize[0] end
 host.card.remove[canvas]
 host:canvas:0
end

module.say:on say text do
 text:fmt @ rtext.split["\n\n" text]
 canvas.font:tfont
 each seg i in text
  t:rtext.string[seg]
  if t[0]~"!"
   host.card.event["command" (1 drop t)]
  else
   dim:canvas.textsize[seg (canvas.size[0] unless dsize[0])-(pad.l+pad.r)]
   szh:dim[1]+(pad.t+pad.b)+next.size[1]
   if dsize[0] dim[0]:dsize[0]-pad.l+pad.r end
   resize[szh unless dsize[1]]
   canvas.pattern:fcolor
   if speed
    host.modules.pt.value.talk[1]
    splits: extract index,1+count t where value in (" ","\n") from "" split t
    si:0 db:0 while si<count splits
     sfx[tsound]
     each in range speed
      if gamepad.up.action si:-1+count splits end
      if pointer.down si:-1+count splits db:1 end
      tick[]
     end
     draw_border[]
     canvas.pattern:fcolor
     canvas.text[rtext.span[seg 0,splits[si]] pad.l,pad.t,dim ("top_%s" format align)]
     si:si+1
    end
    host.modules.pt.value.talk[0]
    if db
     while pointer.held|pointer.down tick[] end
    end
   else
    canvas.text[seg pad.l,pad.t,dim ("top_%s" format align)]
   end
   ns:next..copy[].map[(0,1) dict bcolor,fcolor]
   on wait do
    a:ns[(count ns)%floor sys.frame/nextd]
    canvas.paste[a canvas.size-(pad.r,pad.b)+a.size]
    tick[]
   end
   while !pointer.held|pointer.down|gamepad.held.action|gamepad.down.action wait[] end
   sfx[nsound]
   while pointer.held|pointer.up|gamepad.held.action|gamepad.up.action wait[] end
  end
 end
end

module.ask:on ask text choices do
 seg:fmt[text]
 canvas.font:tfont
 dim:canvas.textsize[seg (canvas.size[0] unless dsize[0])-(pad.l+pad.r)]
 if 1>count choices choices:list "error: empty choice list for dd.ask!" end
 segs:fmt @ choices
 canvas.font:bfont
 dims:each choice in segs
  canvas.textsize[choice (canvas.size[0] unless dsize[0])-(bpad.t+bpad.b)+(pad.t+pad.b)][1]+(bpad.t+bpad.b)
 end
 szh:dim[1]+(pad.t+pad.b)+(sum dims)+(padding*count dims)
 if dsize[0] dim[0]:dsize[0]-pad.l+pad.r end
 resize[szh unless dsize[1]]
 local gamepad_cursor:0
 local r:-1 while -1~r
  draw_border[]
  canvas.font:tfont
  canvas.pattern:fcolor
  canvas.text[seg (pad.l,pad.t),dim ("top_%s" format align)]
  c:dim[1]+pad.t+padding
  ow:canvas.size[0]-(pad.l+pad.r)
  local overone:0
  each choice i in segs
   local rpos:pad.l,c
   local rsize:ow,dims[i]
   local tpos:rpos+bpad.l,bpad.t
   local tsize:rsize-((bpad.l+bpad.r),(bpad.t+bpad.b))
   # active background (invert label)
   canvas.pattern:fcolor
   on active_background do
    if bborder.type~"image"
     canvas.rect[rpos rsize]
    else
     canvas.rect[rpos+2 rsize-4]
    end
   end
   local hovering:rin[pointer.pos-canvas.pos rpos rsize]
   overone:overone|hovering
   if (pointer.held|pointer.down|pointer.up)&hovering
    active_background[]
    if pointer.up r:i end
    canvas.pattern:bcolor
   elseif (i~gamepad_cursor)&gamepad_mode
    active_background[]
    if gamepad.up.action r:i end
    canvas.pattern:bcolor
   end
   # label
   canvas.font:bfont
   canvas.text[choice tpos,tsize balign]
   # border
   if bborder.type~"image"
    canvas.segment[bborder rpos,rsize (range bpad)]
   else
    canvas.pattern:fcolor
    canvas.box[rpos rsize]
   end
   c:c+padding+dims[i]
  end
  if gamepad.up.up   gamepad_cursor:(count segs)%gamepad_cursor-1 end
  if gamepad.up.down gamepad_cursor:(count segs)%gamepad_cursor+1 end
  app.cursor:(nil,"point")[overone]
  tick[]
 end
 app.cursor:nil
 sfx[asound]
 r
end

module.chat:on chat text choices do
 r:0
 st:getstyle[]
 while count choices
  k:keys choices
  style[st]
  v:ask[text k]
  vv:choices[k[v]]
  if "number"~typeof vv
   choices:()
   r:vv
  else
   choices:k[v] drop choices
   say[vv]
  end
 end
 r
end
{end}

{module:pt}
description:"Display and animate sprites for visual novels."
version:1.3
{script}

local FRONT:999999  # foremost (reasonable) widget index
local DELAY:30      # default delay in frames
local host  :0      # the deck
local target:0      # the (current) target card
local talk_enable:0 # should we be animating 'talking' puppets currently?

on eval_snippet x do
 local d:()
 d.deck    :host
 d.patterns:host.patterns
 d.card    :host.card
 d:d       ,host.modules..value
 d:d       ,host.cards
 d:d       ,host.card.widgets
 eval[x d 1]
end
on tween a b t    do (b*t)+(a*1-t) end
on blink_interval do 150+random[150] end

#######################################
#
#  State Management
#
#######################################

on get_charsheet name do
 host.cards[name]
end

on get_state_name name do
 "%s_pstate" format name
end

on puppet_names do
 extract where target.widgets @ get_state_name @ value from keys target.widgets
end

on init_puppet name do
 sheet:get_charsheet[name]
 if !name in target.widgets
  if "contraption"~typeof first sheet.widgets
   pc:first target.paste[sheet.copy[first sheet.widgets]]
   pc.name:name
  else
   pc:target.add["canvas" name]
   pc.border:0
   pc.locked:1
   pc.animated:1
   pc.script:"
    on view do
     pt.animate[deck me.name]
    end
   "
  end
  pc.show:"transparent"
  target.widgets.dd_overlay.index:FRONT
 end
 sname:get_state_name[name]
 if !sname in target.widgets
  ps:target.add["field" sname]
  ps.show:"none"
  s:()
  s.emote:first keys sheet.widgets
  s.hflip:0
  s.pos:"center"
  s.blink:blink_interval[]
  ps.data:s
 end
end

on get_puppet name do
 init_puppet[name]
 r:target.widgets[get_state_name[name]].data
 r.wid:target.widgets[name]
 r.name:name
 r
end

on set_puppet state do
 init_puppet[state.name]
 target.widgets[get_state_name[state.name]].data:("wid","name") drop state
end

#######################################
#
#  Presentation
#
#                                offtop
#               +------------------------------------------+
#    offtopleft | topleft          top            topright | offtopright
#               |                                          |
# offcenterleft | centerleft      center       centerright | offcenterright
#               |                                          |
#       offleft | left            bottom             right | offright
#               +------------------------------------------+
#                 offbottomleft  offbottom  offbottomright
#
#######################################

positions:raze insert key value with
 "center"         on center         c do .5*target.size-c.size end
 "offcenterleft"  on offcenterleft  c do (first -c.size           ),(.5*last target.size-c.size) end
 "centerleft"     on centerleft     c do (0                       ),(.5*last target.size-c.size) end
 "centerright"    on centerright    c do (first target.size-c.size),(.5*last target.size-c.size) end
 "offcenterright" on offcenterright c do (first target.size       ),(.5*last target.size-c.size) end
 "offtopleft"     on offtopleft     c do (first -c.size    ),0 end
 "offtopright"    on offtopright    c do (first target.size),0 end
 "topleft"        on topleft        c do (0                          ),0 end
 "offtop"         on offtop         c do (.5*first target.size-c.size),(last -c.size) end
 "top"            on top            c do (.5*first target.size-c.size),0 end
 "topright"       on topright       c do (   first target.size-c.size),0 end
 "offleft"        on offleft        c do (   first            -c.size),(last target.size-c.size) end
 "left"           on left           c do (0                          ),(last target.size-c.size) end
 "bottom"         on bottom         c do (.5*first target.size-c.size),(last target.size-c.size) end
 "right"          on right          c do (   first target.size-c.size),(last target.size-c.size) end
 "offright"       on offright       c do (   first target.size       ),(last target.size-c.size) end
 "offbottomleft"  on offbottomleft  c do (0                          ),(last target.size       ) end
 "offbottom"      on offbottom      c do (.5*first target.size-c.size),(last target.size       ) end
 "offbottomright" on offbottomright c do (   first target.size-c.size),(last target.size       ) end
end

on get_pos canv pos do
 if pos in positions # predefined position
  positions[pos][canv]
 elseif pos in target.widgets # custom position (centered)
  wid:target.widgets[pos]
  (wid.pos+.5*wid.size)-.5*canv.size
 else
  positions.bottom[canv]
 end
end

skews:raze insert key value with
 "offcenterleft" (-1, 0)
 "centerleft"    (-1, 0)
 "center"        ( 0, 0)
 "centerright"   ( 1, 0)
 "offcenterright"( 1, 0)
 "offtopleft"    (-1,-1)
 "offtopright"   ( 1,-1)
 "topleft"       (-1,-1)
 "offtop"        ( 0,-1)
 "top"           ( 0,-1)
 "topright"      ( 1,-1)
 "offleft"       (-1, 1)
 "left"          (-1, 1)
 "bottom"        ( 0, 1)
 "right"         ( 1, 1)
 "offright"      ( 1, 1)
 "offbottomleft" (-1, 1)
 "offbottom"     ( 0, 1)
 "offbottomright"( 1, 1)
end

on paint_puppet state do
 if "contraption"~typeof state.wid
  if !"none"~state.wid.show state.wid.animate[] end
 else
  sheet:get_charsheet[state.name]
  face:sheet.widgets[state.emote]
  if state.talking&talk_enable
   faces:face,extract value where (key like ("%s_open*" format state.emote))&!(key like "*_blink") from sheet.widgets
   face:faces[(count faces)%floor sys.frame/6]
  elseif state.blink
   face:face unless sheet.widgets["%s_blink" format state.emote]
  end
  canv:state.wid
  canv.size:face.size
  if !"none"~canv.show
   img:if state.hflip face.copy[].transform["horiz"] else face.copy[] end
   if (state.anim~"backforth")&2%floor sys.frame/15 img.transform["horiz"] end
   canv.clear[]
   if state.anim~"breathe"
    skew:skews[state.pos]
    m:3
    n:m*1+sin(pi+.1*canv.index)*(sys.frame)/120
    p:(n+2*m*skew[0]),0
    s:(canv.size[0]-2*n),canv.size[1]
    canv.paste[img p,s]
   elseif state.anim~"spin"
    tmp:image[img.size*2]
    tmp.paste[img .5*tmp.size-img.size]
    tmp.rotate[sys.frame/120]
    canv.paste[tmp .5*canv.size-tmp.size]
   else
    canv.paste[img]
   end
  end
 end
end

on move_puppet state do
 canv:state.wid
 canv.pos:if state.steps
  tween[get_pos[canv state.gpos] get_pos[canv state.pos] state.steps/state.delay]
 else
  get_pos[canv state.pos]
 end
 skew:skews[state.pos]
 if state.anim~"bob"
  m:10&0.1*canv.size[1]
  n:m*sin(pi+.1*canv.index)*sys.frame/60
  canv.pos:canv.pos + 0,(n+m*skew[1])
 end
 if state.anim~"shake"
  m:.05*canv.size[0]
  n:m*cos(pi+.1*canv.index)*sys.frame/5
  canv.pos:canv.pos + (n+m*skew[0]),0
 end
end

on exec_anim state do
 pending_paint:0
 pending_move :0
 # blinking
 state.blink_delay:0|state.blink_delay-1
 if !state.blink_delay
  state.blink:4 # blink for 4 frames!
  state.blink_delay:blink_interval[]
  pending_paint:1
 elseif state.blink
  state.blink:0|state.blink-1
  if !state.blink pending_paint:1 end
 end
 if state.talking&talk_enable pending_paint:1 end
 # movement tweening
 if state.steps
  state.steps:0|state.steps-1
  if !state.steps state.pos:state.gpos end
  pending_move:1
 end
 # idle animations
 if state.anim in "breathe","spin","backforth" pending_paint:1 end
 if state.anim in "bob","shake" pending_move:1 end
 # wrap up
 if "contraption"~typeof state.wid pending_paint:1 end
 if pending_paint              paint_puppet[state] end
 if pending_paint|pending_move move_puppet[state] end
 set_puppet[state]
end

#######################################
#
#  Commands
#
#  show  NAME               # default emote, pos is center OR kept as-is
#  show  NAME EMOTE         # pos is center
#  show  NAME EMOTE POS
#  hide  NAME
#  flip  NAME 1|0           # flip sprite image horizontal
#  order NAME front|back    # change sprite order
#  move  NAME POS DELAY     # interpolated; delay is in frames @ 60fps
#  anim  NAME TYPE          # (none, bob, shake, breathe)
#  wait                     # blocking wait for all in-progress anims to finish
#  wait DELAY               # blocking wait for exactly N frames
#  shake XMAG YMAG DELAY    # screen shake for N frames with horizontal/vertical intensity
#  talk NAME...             # select 0 or more 'talking' puppets by name
#  play NAME                # play a sound
#  lil ANYTHING             # execute a lil snippet
#  clear                    # remove all puppets
#
#######################################

commands.show:on cmd_show x do
 if count x
  state:get_puppet[first x]
  if x[1] state.emote:x[1] state.wid.emote:x[1] end
  if x[2] state.pos  :x[2] end
  state.wid.show:"transparent"
  paint_puppet[state]
  move_puppet[state]
  set_puppet[state]
 else explode["error: missing puppet name for !show"] end
end

commands.hide:on cmd_hide x do
 if count x
  get_puppet[(first x)].wid.show:"none"
 else alert["error: missing puppet name for !hide"] end
end

commands.flip:on cmd_flip x do
 if count x 
  state:get_puppet[first x]
  state.hflip:0+if 1<count x x[1] else !state.hflip end
  state.wid.flip:state.hflip
  paint_puppet[state]
  set_puppet[state]
 else alert["error: missing puppet name for !flip"] end
end

commands.order:on cmd_order x do
 if count x
  get_puppet[(first x)].wid.index:if "back"~x[1] -1 else FRONT end
  target.widgets.dd_overlay.index:FRONT
 else alert["error: missing puppet name for !order"] end
end

commands.move:on cmd_move x do
 if count x
  dest:x[1]
  delay:DELAY unless x[2]
  state:get_puppet[first x]
  state.gpos:dest
  state.delay:delay
  state.steps:delay
  move_puppet[state]
  set_puppet[state]
 else alert["error: missing puppet name for !move"] end
end

commands.anim:on cmd_anim x do
 if count x
  state:get_puppet[first x]
  state.anim:x[1] state.wid.anim:state.anim
  set_puppet[state]
 else alert["error: missing puppet name for !anim"] end
end

commands.wait:on cmd_wait x do
 local ol:target.widgets.dd_overlay
 local sh:ol.show
 ol.show:"none"
 on tick do target.event["animate"] sleep[] end
 if first x
  each in range 0+first x tick[] end
 else
  while max (get_puppet @ puppet_names[])..steps tick[] end
 end
 ol.show:sh
end

local shake_mag:30,30
local shake_dur:15
commands.shake:on cmd_shake x do
 if 1<count x shake_mag:0|0+2 take x end
 if 2<count x shake_dur:1|0+x[2] end
 local ol:target.widgets.dd_overlay
 local sh:ol.show
 ol.show:"none"
 go[host.card on shake_trans c a b t do
  local m:shake_mag*1-t
  c.pattern:1
  c.rect[0,0 c.size]
  c.paste[a (random@2*m)-m]
 end shake_dur]
 ol.show:sh
end

commands.talk:on cmd_talk x do
 each name in puppet_names[]
  state:get_puppet[name]
  state.talking:name in x
  set_puppet[state]
 end
end

commands.play:on cmd_play x do
 play[first x]
end

commands.clear:on cmd_clear do
 clear[target]
end

on exec_command text do
 if "lil"~3 limit text
  eval_snippet[3 drop text]
 else
  f:extract where count@value from " " split text
  (commands[first f])[1 drop f]
 end
end

#######################################
#
#  Public API
#
#######################################

module.setup:on setup deck card commands do
 host:deck
 target:card
 # accept list of commands OR a single string with newlines,
 # with or without a leading '!'
 each line in "\n" split "\n" fuse (),commands
  if "!"~first line line:1 drop line end
  exec_command[line]
 end
end

module.command:on command deck commands do
 setup[deck deck.card commands]
end

module.animate:on animate deck puppet do
 host:deck
 target:deck.card
 if puppet
  exec_anim[get_puppet[puppet]]
 else
  each name in puppet_names[]
   exec_anim[get_puppet[name]]
  end
 end
end

module.clear:on clear card do
 target:host.card unless card
 each name in puppet_names[]
  target.remove[target.widgets[name]]
  target.remove[target.widgets[get_state_name[name]]]
 end
end

module.talk:on talk enable do
 talk_enable:enable
 each name in puppet_names[]
  state:get_puppet[name]
  state.wid.talk:enable
  set_puppet[state]
  paint_puppet[state]
 end
end

{end}

   draw_box(b,0,1)

   const letter=k.v&&/^[a-zA-Z]$/.test(k.v)?k.v.toLowerCase().charCodeAt(0)-97: -1

   else if(k.v=='CapsLock'){if(ev.mu&&a)kc.lock^=1;if(kc.lock)kd=1}

apply=(fwd,x)=>{

   })

                canvas_is(sc.target)?(p=1,lms('on click pos do\n \nend\n\non drag pos do\n \nend\n\non release pos do\n \nend')):v
 if(p&&widget_is(sc.target)&&!contraption_is(sc.target)&&lb(ifield(sc.target,'animated'))){v=lms(ls(v)+'\n\non view do\n \nend')}

}

let viewed=lmd()
find_animated=_=>{
 const r=lmd();if(uimode!='interact')return r
 con_wids().v.map(wid=>{
  if(lb(ifield(wid,'animated'))&&!dget(viewed,wid))dset(r,wid,ZERO)
  if(contraption_is(wid))ivalue(wid,'widgets').v.map(cwid=>{if(lb(ifield(cwid,'animated'))&&!dget(viewed,cwid))dset(r,cwid,ONE)})
 });return r
}
fire_animate=targets=>{
 const root=lmenv(),block=lmblk();primitives(root,deck),constants(root)
 targets.k.map(w=>{blk_cat(block,event_invoke(w,'view',lml([NIL]),null)),dset(viewed,w,ONE)})
 pushstate(root),pending_popstate=1,issue(root,block)
}
fire_view=target=>{
 const root=lmenv();primitives(root,deck),constants(root)
 const block=event_invoke(target,'view',lml([NIL]),null)
 ifield(target,'widgets').v.filter(w=>contraption_is(w)&&!dget(viewed,w)).map(w=>{blk_cat(block,event_invoke(w.viewproxy,'view',lml([NIL]),null)),dset(viewed,w,ONE)})
 pushstate(root),pending_popstate=1,issue(root,block)
}
interpret=_=>{
 viewed=lmd()
 if(msg.overshoot&&!running()&&!msg.pending_view&&!msg.next_view)msg.overshoot=0
 if(msg.pending_halt){if(running())halt();sleep_frames=0,sleep_play=0,msg.pending_view=0,msg.next_view=0}
 if(sleep_play&&sfx_any())return 0;sleep_play=0
 if(sleep_frames){sleep_frames--;return 0}
 const nomodal=_=>(ms.type==null||ms.type=='query'||ms.type=='listen')
 let quota=FRAME_QUOTA;while(1){
  while(nomodal()&&running()&&sleep_frames==0&&sleep_play==0&&quota>0){runop(),quota--,mark_dirty()}frame=context
  if(quota<=0&&running())msg.overshoot=1
  if(!nomodal()||quota<=0||sleep_frames||sleep_play){if(sleep_frames)sleep_frames--;break}
  if(!running()&&pending_popstate)popstate(),pending_popstate=0
  const a=find_animated()
  if(msg.pending_halt||pending_popstate){/*suppress other new events until this one finishes*/}
  else if(msg.pending_view){fire_view(con()),msg.pending_view=0}
  else if(msg.target_click){
   const arg=grid_is(msg.target_click)?lmn(msg.arg_click.y): canvas_is(msg.target_click)?lmpair(msg.arg_click): NIL
   fire_event_async(msg.target_click,'click',arg),msg.target_click=null
  }
  else if(msg.target_drag    ){fire_event_async(msg.target_drag    ,'drag'      ,lmpair(msg.arg_drag   )),msg.target_drag    =null}
  else if(msg.target_release ){fire_event_async(msg.target_release ,'release'   ,lmpair(msg.arg_release)),msg.target_release =null}
  else if(msg.target_run     ){fire_event_async(msg.target_run     ,'run'       ,msg.arg_run            ),msg.target_run     =null}
  else if(msg.target_link    ){fire_event_async(msg.target_link    ,'link'      ,msg.arg_link           ),msg.target_link    =null}
  else if(msg.target_order   ){fire_event_async(msg.target_order   ,'order'     ,msg.arg_order          ),msg.target_order   =null}
  else if(msg.target_ccell   ){fire_event_async(msg.target_ccell   ,'changecell',msg.arg_ccell          ),msg.target_ccell   =null}
  else if(msg.target_change  ){fire_event_async(msg.target_change  ,'change'    ,msg.arg_change         ),msg.target_change  =null}
  else if(msg.target_navigate){fire_event_async(msg.target_navigate,'navigate'  ,msg.arg_navigate       ),msg.target_navigate=null}
  else if(count(a)           ){fire_animate(a)}
  if(!running())break // not running, and no remaining events to process, so we're done for this frame
 }if(msg.next_view&&ms.type!='listen')msg.pending_view=1,msg.next_view=0 // no more than one view[] event per frame!
 return FRAME_QUOTA-quota
}

    const dr=(0xFF&(a>>16))-(0xFF&(b>>16))
    const dg=(0xFF&(a>> 8))-(0xFF&(b>> 8))
    const db=(0xFF&(a    ))-(0xFF&(b    ))
    return (dr*dr)+(dg*dg)+(db*db)
   }
   iwrite(deck.patterns,lmn(32),lmn(0xFFFFFF)),iwrite(deck.patterns,lmn(47),ZERO)
   let pal=ll(dyad.parse(lms('%h'),lml(t.split('\n').slice(0,-1).map(lms))))
   if(pal.length>14){
    let a=0,b=0;pal.map((v,i)=>{
     if(color_dist(ln(v),0x000000)<color_dist(ln(pal[a]),0x000000))a=i
     if(color_dist(ln(v),0xFFFFFF)<color_dist(ln(pal[b]),0xFFFFFF))b=i
    })
    iwrite(deck.patterns,lmn(47),pal[a]),iwrite(deck.patterns,lmn(32),pal[b])
    pal=pal.filter((_,i)=>i!=a&&i!=b)
   }for(let z=0;z<PAL_COLORS-2&&z<pal.length;z++)iwrite(deck.patterns,lmn((33+z)+(z>=15?1:0)),pal[z])
  })
 }
 if(/^image\//.test(file.type)){load_image(file)}
 if(/^audio\//.test(file.type)){load_sound(file)}
}

pushstate(lmenv()),load_deck(deck_read(q('script[language="decker"]').innerText))
const tag=decodeURI((new URL(document.URL)).hash.slice(1)||'');if(tag.length)iwrite(deck,lms('card'),lms(tag))
resize(),requestAnimationFrame(loop)
</script></body>
